version: 2
updates:
  - package-ecosystem: github-actions
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    directory: /

  - package-ecosystem: docker
    directories:
      - "*"
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ['version-update:semver-major']
    cooldown:
      default-days: 7

  - package-ecosystem: "gomod"
    directories:
      - "/"
      - "/**/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/**/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/**/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
